<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Apex GP</title>

<style>
*{box-sizing:border-box}

html,body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#8fb4d9;
    font-family:Arial,Helvetica,sans-serif;
    color:white;
}

canvas{display:block}

#hud{
    position:fixed;
    inset:0;
    pointer-events:none;
    z-index:10;
}

/* =========================================================
   TOP HUD
   ========================================================= */

#status{
    position:absolute;
    top:25px;
    left:25px;
    font-size:13px;
    letter-spacing:1px;
}

#positionBox{
    position:absolute;
    top:53px;
    left:25px;
    font-size:17px;
    font-weight:700;
}

#systems{
    position:absolute;
    right:25px;
    top:25px;
    text-align:right;
    font-size:13px;
    line-height:1.7;
}

#lapBox{
    position:absolute;
    top:22px;
    left:50%;
    transform:translateX(-50%);
    text-align:center;
    padding:10px 20px;
    background:rgba(8,14,22,.68);
    border-radius:10px;
    border:1px solid rgba(255,255,255,.16);
}

#lap{
    font-size:25px;
    font-weight:700;
}

#lapTime{
    font-size:14px;
    color:#ddd;
    margin-top:3px;
}

/* =========================================================
   LIVE LEADERBOARD
   ========================================================= */

#raceLeaderboard{
    position:absolute;
    top:92px;
    left:25px;
    width:215px;
    padding:10px;
    background:rgba(8,14,22,.72);
    border:1px solid rgba(255,255,255,.16);
    border-radius:12px;
    backdrop-filter:blur(8px);
}

.leaderboard-title{
    font-size:10px;
    letter-spacing:1.5px;
    color:#aaa;
    margin-bottom:7px;
    font-weight:700;
}

.leaderboard-row{
    display:grid;
    grid-template-columns:25px 1fr 50px;
    align-items:center;
    height:25px;
    padding:0 5px;
    border-radius:5px;
    font-size:12px;
    transition:.15s;
}

.leaderboard-row .pos{
    color:#aaa;
    font-weight:700;
}

.leaderboard-row .name{
    overflow:hidden;
    white-space:nowrap;
    text-overflow:ellipsis;
}

.leaderboard-row .gap{
    text-align:right;
    color:#aaa;
    font-size:10px;
}

.leaderboard-row.player{
    background:rgba(40,190,90,.18);
    border:1px solid rgba(60,220,110,.28);
}

.leaderboard-row.player .name{
    color:#61e98a;
    font-weight:700;
}

.leaderboard-row.finished .name{
    color:#fff;
}

/* =========================================================
   MINIMAP
   ========================================================= */

#miniMap{
    position:absolute;
    right:25px;
    bottom:112px;
    width:225px;
    height:170px;
    padding:7px;
    background:rgba(8,14,22,.72);
    border:1px solid rgba(255,255,255,.18);
    border-radius:12px;
    backdrop-filter:blur(8px);
}

#miniMapCanvas{
    width:100%;
    height:100%;
    display:block;
}

/* =========================================================
   SPEED / GEAR
   ========================================================= */

#speedBox{
    position:absolute;
    left:28px;
    bottom:25px;
    width:185px;
    padding:14px 18px;
    background:rgba(8,14,22,.72);
    border:1px solid rgba(255,255,255,.18);
    border-radius:12px;
    backdrop-filter:blur(8px);
}

#speed{
    font-size:42px;
    font-weight:700;
    line-height:1;
}

#kmh{
    font-size:13px;
    color:#ddd;
}

#gear{
    position:absolute;
    right:28px;
    bottom:25px;
    width:100px;
    text-align:center;
    font-size:54px;
    font-weight:700;
    padding:10px;
    border-radius:12px;
    background:rgba(8,14,22,.72);
    border:1px solid rgba(255,255,255,.18);
}

/* =========================================================
   COUNTDOWN / MESSAGE
   ========================================================= */

#countdown{
    position:absolute;
    left:50%;
    top:50%;
    transform:translate(-50%,-50%);
    font-size:90px;
    font-weight:800;
    text-shadow:0 0 25px rgba(255,255,255,.5);
    display:none;
}

#message{
    position:absolute;
    left:50%;
    top:40%;
    transform:translate(-50%,-50%);
    font-size:30px;
    font-weight:700;
    text-align:center;
    display:none;
}

/* =========================================================
   CONTROLS
   ========================================================= */

#controls{
    position:absolute;
    left:50%;
    bottom:18px;
    transform:translateX(-50%);
    font-size:11px;
    color:rgba(255,255,255,.7);
    white-space:nowrap;
}

#collisionStatus{
    position:absolute;
    left:50%;
    bottom:62px;
    transform:translateX(-50%);
    font-size:11px;
    color:rgba(255,255,255,.6);
}

/* =========================================================
   FINISH SCREEN
   ========================================================= */

#finishOverlay{
    position:fixed;
    inset:0;
    z-index:50;
    display:flex;
    align-items:center;
    justify-content:center;
    background:rgba(3,7,11,.78);
    backdrop-filter:blur(10px);
}

#finishOverlay.hidden{
    display:none;
}

.finish-panel{
    width:470px;
    max-width:calc(100vw - 40px);
    padding:25px;
    background:rgba(12,18,26,.94);
    border:1px solid rgba(255,255,255,.18);
    border-radius:16px;
    box-shadow:0 20px 70px rgba(0,0,0,.45);
}

.finish-kicker{
    text-align:center;
    font-size:11px;
    letter-spacing:3px;
    color:#aaa;
    margin-bottom:5px;
}

#finishTitle{
    text-align:center;
    font-size:32px;
    font-weight:800;
    margin-bottom:4px;
}

#finishTime{
    text-align:center;
    color:#aaa;
    font-size:13px;
    margin-bottom:18px;
}

#finishLeaderboard{
    width:100%;
}

.finish-row{
    display:grid;
    grid-template-columns:45px 1fr 100px;
    align-items:center;
    height:39px;
    padding:0 12px;
    margin-bottom:4px;
    border-radius:7px;
    background:rgba(255,255,255,.045);
    font-size:14px;
}

.finish-row .finish-pos{
    font-weight:800;
    color:#aaa;
}

.finish-row .finish-name{
    font-weight:600;
}

.finish-row .finish-gap{
    text-align:right;
    color:#aaa;
    font-size:12px;
}

.finish-row.player{
    background:rgba(40,190,90,.18);
    border:1px solid rgba(60,220,110,.3);
}

.finish-row.player .finish-name{
    color:#62eb8c;
}

#restartButton{
    width:100%;
    margin-top:18px;
    height:44px;
    border:0;
    border-radius:8px;
    background:#e7e7e7;
    color:#101318;
    font-weight:800;
    cursor:pointer;
    pointer-events:auto;
}

#restartButton:hover{
    background:white;
}

/* =========================================================
   MOBILE
   ========================================================= */

@media(max-width:800px){

    #raceLeaderboard{
        width:180px;
        transform:scale(.88);
        transform-origin:top left;
    }

    #miniMap{
        width:180px;
        height:135px;
        right:12px;
        bottom:105px;
    }

    #controls{
        font-size:8px;
    }

    #speedBox{
        left:12px;
        bottom:15px;
    }

    #gear{
        right:12px;
        bottom:15px;
    }
}
</style>

<script type="importmap">
{
    "imports":{
        "three":"https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
        "three/addons/":"https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"
    }
}
</script>
</head>

<body>

<div id="hud">

    <div id="status">APEX GP</div>

    <div id="positionBox">
        P <span id="position">1</span> / 9
    </div>

    <div id="systems">
        DRS: <span id="drsState">OFF</span><br>
        ERS: <span id="ersState">100%</span><br>
        BRAKES: <span id="brakeState">0%</span>
    </div>

    <div id="lapBox">
        <div id="lap">LAP 1 / 5</div>
        <div id="lapTime">00:00.000</div>
    </div>

    <!-- LIVE LEADERBOARD -->
    <div id="raceLeaderboard">
        <div class="leaderboard-title">
            LIVE CLASSIFICATION
        </div>
        <div id="leaderboardRows"></div>
    </div>

    <!-- MINI MAP -->
    <div id="miniMap">
        <canvas id="miniMapCanvas"></canvas>
    </div>

    <div id="countdown"></div>
    <div id="message"></div>

    <div id="speedBox">
        <div id="speed">0</div>
        <div id="kmh">KM/H</div>
    </div>

    <div id="gear">N</div>

    <div id="collisionStatus">
        CAR COLLISION SYSTEM ACTIVE
    </div>

    <div id="controls">
        W / ↑ ACCELERATE
        &nbsp;&nbsp;
        S / ↓ BRAKE
        &nbsp;&nbsp;
        A / ← / D / → STEER
        &nbsp;&nbsp;
        SPACE DRS
        &nbsp;&nbsp;
        E ERS
        &nbsp;&nbsp;
        C CAMERA
        &nbsp;&nbsp;
        R RESTART
    </div>

</div>


<!-- FINISH SCREEN -->

<div id="finishOverlay" class="hidden">

    <div class="finish-panel">

        <div class="finish-kicker">
            APEX GP
        </div>

        <div id="finishTitle">
            CHEQUERED FLAG
        </div>

        <div id="finishTime">
            Race Time: 00:00.000
        </div>

        <div id="finishLeaderboard"></div>

        <button id="restartButton">
            RACE AGAIN
        </button>

    </div>

</div>


<script type="module">

import * as THREE from "three";
import {GLTFLoader} from "three/addons/loaders/GLTFLoader.js";


/* =========================================================
   SCENE
   ========================================================= */

const scene = new THREE.Scene();

scene.background =
    new THREE.Color(0x8fb4d9);

scene.fog =
    new THREE.FogExp2(
        0x9bbbd8,
        0.00042
    );


/* =========================================================
   RENDERER
   ========================================================= */

const renderer =
    new THREE.WebGLRenderer({
        antialias:true,
        powerPreference:"high-performance"
    });

renderer.setSize(
    window.innerWidth,
    window.innerHeight
);

renderer.setPixelRatio(
    Math.min(
        window.devicePixelRatio,
        1.5
    )
);

renderer.shadowMap.enabled=true;
renderer.shadowMap.type=
    THREE.PCFSoftShadowMap;

renderer.outputColorSpace=
    THREE.SRGBColorSpace;

renderer.toneMapping=
    THREE.ACESFilmicToneMapping;

renderer.toneMappingExposure=1.15;

document.body.appendChild(
    renderer.domElement
);


/* =========================================================
   CAMERA
   ========================================================= */

const camera =
    new THREE.PerspectiveCamera(
        68,
        window.innerWidth/
        window.innerHeight,
        .1,
        5000
    );


/* =========================================================
   LIGHTING
   ========================================================= */

const hemi =
    new THREE.HemisphereLight(
        0xc7e3ff,
        0x46504a,
        1.9
    );

scene.add(hemi);


const sun =
    new THREE.DirectionalLight(
        0xfff4d6,
        3.0
    );

sun.position.set(
    -500,
    900,
    350
);

sun.castShadow=true;

sun.shadow.mapSize.width=2048;
sun.shadow.mapSize.height=2048;

sun.shadow.camera.left=-1200;
sun.shadow.camera.right=1200;
sun.shadow.camera.top=1200;
sun.shadow.camera.bottom=-1200;

sun.shadow.bias=-.0002;

scene.add(sun);


/* =========================================================
   GROUND
   ========================================================= */

const groundMaterial =
    new THREE.MeshStandardMaterial({
        color:0x66715d,
        roughness:1
    });

const ground =
    new THREE.Mesh(
        new THREE.PlaneGeometry(
            4000,
            4000
        ),
        groundMaterial
    );

ground.rotation.x=
    -Math.PI/2;

ground.position.y=-.08;

ground.receiveShadow=true;

scene.add(ground);


/* =========================================================
   TRACK CONFIG
   ========================================================= */

const TRACK_SCALE=1.30;
const TRACK_HALF_WIDTH=13;
const KERB_WIDTH=3.5;
const RUNOFF_WIDTH=20;
const WALL_DISTANCE=38;
const TRACK_SAMPLES=1600;


/* =========================================================
   TRACK CONTROL POINTS
   ========================================================= */

const rawPoints=[

    [0,0,260],
    [0,0,150],
    [35,0,80],
    [80,0,25],
    [125,0,-5],
    [145,0,-65],
    [125,0,-125],
    [165,0,-185],
    [215,0,-215],
    [270,0,-195],
    [315,0,-145],
    [350,0,-80],
    [390,0,-15],
    [450,0,15],
    [515,0,5],
    [580,0,35],
    [635,0,90],
    [650,0,155],
    [610,0,215],
    [550,0,250],
    [485,0,275],
    [420,0,255],
    [355,0,285],
    [285,0,325],
    [210,0,340],
    [150,0,315],
    [100,0,275],
    [55,0,265],
    [30,0,300],
    [20,0,350],
    [10,0,330]
];


const cornerPoints =
    rawPoints.map(
        p=>new THREE.Vector3(
            p[0]*TRACK_SCALE,
            p[1],
            p[2]*TRACK_SCALE
        )
    );


const trackCurve =
    new THREE.CatmullRomCurve3(
        cornerPoints,
        true,
        "centripetal",
        .35
    );


/* =========================================================
   TRACK DATA
   ========================================================= */

const trackData=[];

for(
    let i=0;
    i<TRACK_SAMPLES;
    i++
){

    const t=
        i/TRACK_SAMPLES;

    const p=
        trackCurve.getPointAt(t);

    const tangent=
        trackCurve
            .getTangentAt(t)
            .normalize();

    const normal=
        new THREE.Vector3(
            -tangent.z,
            0,
            tangent.x
        ).normalize();

    trackData.push({
        t,
        p,
        tangent,
        normal
    });
}


/* =========================================================
   SAFE TRACK INDEX
   ========================================================= */

function wrapTrackIndex(index){

    if(!Number.isFinite(index)){
        return 0;
    }

    let wrapped=
        Math.floor(index)%
        TRACK_SAMPLES;

    if(wrapped<0){
        wrapped+=TRACK_SAMPLES;
    }

    return wrapped;
}


/* =========================================================
   TRACK SAMPLE
   ========================================================= */

function getTrackSample(index){

    return trackData[
        wrapTrackIndex(index)
    ];
}


/* =========================================================
   TRACK DISTANCE TABLE
   ========================================================= */

const trackDistance=
    new Float32Array(
        TRACK_SAMPLES
    );

let calculatedTrackLength=0;

for(
    let i=0;
    i<TRACK_SAMPLES;
    i++
){

    trackDistance[i]=
        calculatedTrackLength;

    const next=
        wrapTrackIndex(i+1);

    calculatedTrackLength+=
        trackData[i].p.distanceTo(
            trackData[next].p
        );
}

const TRACK_LENGTH=
    calculatedTrackLength;

const METERS_PER_SAMPLE=
    TRACK_LENGTH/
    TRACK_SAMPLES;


/* =========================================================
   TRACK RIBBON
   ========================================================= */

function createRibbon(
    width,
    y,
    material
){

    const positions=[];
    const uvs=[];
    const indices=[];

    for(
        let i=0;
        i<=TRACK_SAMPLES;
        i++
    ){

        const d=
            getTrackSample(i);

        const left=
            d.p.clone()
                .addScaledVector(
                    d.normal,
                    width
                );

        const right=
            d.p.clone()
                .addScaledVector(
                    d.normal,
                    -width
                );

        left.y+=y;
        right.y+=y;

        positions.push(
            left.x,
            left.y,
            left.z,

            right.x,
            right.y,
            right.z
        );

        const v=i/20;

        uvs.push(
            0,v,
            1,v
        );
    }

    for(
        let i=0;
        i<TRACK_SAMPLES;
        i++
    ){

        const a=i*2;
        const b=a+1;
        const c=a+2;
        const d=a+3;

        indices.push(
            a,b,c,
            b,d,c
        );
    }

    const geometry=
        new THREE.BufferGeometry();

    geometry.setAttribute(
        "position",
        new THREE.Float32BufferAttribute(
            positions,
            3
        )
    );

    geometry.setAttribute(
        "uv",
        new THREE.Float32BufferAttribute(
            uvs,
            2
        )
    );

    geometry.setIndex(indices);

    geometry.computeVertexNormals();

    const mesh=
        new THREE.Mesh(
            geometry,
            material
        );

    mesh.receiveShadow=true;

    scene.add(mesh);

    return mesh;
}


/* =========================================================
   ASPHALT
   ========================================================= */

const asphaltMaterial=
    new THREE.MeshStandardMaterial({
        color:0x30343a,
        roughness:.9,
        metalness:.02
    });

createRibbon(
    TRACK_HALF_WIDTH,
    .01,
    asphaltMaterial
);


/* =========================================================
   RUNOFF
   ========================================================= */

const runoffMaterial=
    new THREE.MeshStandardMaterial({
        color:0x70777d,
        roughness:1
    });

createRibbon(
    TRACK_HALF_WIDTH+
    KERB_WIDTH+
    RUNOFF_WIDTH,
    -.015,
    runoffMaterial
);


/* =========================================================
   KERBS
   ========================================================= */

const redKerbMaterial=
    new THREE.MeshStandardMaterial({
        color:0xc71924,
        roughness:.65
    });

const whiteKerbMaterial=
    new THREE.MeshStandardMaterial({
        color:0xe5e5e5,
        roughness:.65
    });

const kerbGroup=
    new THREE.Group();

const kerbGeometry=
    new THREE.BoxGeometry(
        18,
        .12,
        KERB_WIDTH
    );

for(
    let i=0;
    i<TRACK_SAMPLES;
    i+=24
){

    const d=
        getTrackSample(i);

    for(
        const side of [-1,1]
    ){

        const pos=
            d.p.clone()
                .addScaledVector(
                    d.normal,
                    side*(
                        TRACK_HALF_WIDTH+
                        KERB_WIDTH/2
                    )
                );

        const kerb=
            new THREE.Mesh(
                kerbGeometry,
                Math.floor(i/24)%2===0
                    ?redKerbMaterial
                    :whiteKerbMaterial
            );

        kerb.position.copy(pos);
        kerb.position.y=.08;

        kerb.rotation.y=
            Math.atan2(
                d.tangent.x,
                d.tangent.z
            );

        kerb.receiveShadow=true;

        kerbGroup.add(kerb);
    }
}

scene.add(kerbGroup);


/* =========================================================
   WALLS
   ========================================================= */

const wallMaterial=
    new THREE.MeshStandardMaterial({
        color:0x737980,
        roughness:.8,
        metalness:.15
    });

const wallGeometry=
    new THREE.BoxGeometry(
        10,
        1.2,
        1
    );

const wallGroup=
    new THREE.Group();

for(
    let i=0;
    i<TRACK_SAMPLES;
    i+=12
){

    const d=
        getTrackSample(i);

    for(
        const side of [-1,1]
    ){

        const pos=
            d.p.clone()
                .addScaledVector(
                    d.normal,
                    side*WALL_DISTANCE
                );

        const wall=
            new THREE.Mesh(
                wallGeometry,
                wallMaterial
            );

        wall.position.copy(pos);
        wall.position.y=.65;

        wall.rotation.y=
            Math.atan2(
                d.tangent.x,
                d.tangent.z
            );

        wall.receiveShadow=true;

        wallGroup.add(wall);
    }
}

scene.add(wallGroup);


/* =========================================================
   START LINE
   ========================================================= */

const startLine=
    new THREE.Mesh(
        new THREE.BoxGeometry(
            TRACK_HALF_WIDTH*2,
            .025,
            2.5
        ),
        new THREE.MeshBasicMaterial({
            color:0xffffff
        })
    );

const startData=
    getTrackSample(0);

startLine.position.copy(
    startData.p
);

startLine.position.y=.04;

startLine.rotation.y=
    Math.atan2(
        startData.tangent.x,
        startData.tangent.z
    );

scene.add(startLine);


/* =========================================================
   GRID MARKERS
   ========================================================= */

const gridMaterial=
    new THREE.MeshBasicMaterial({
        color:0xffffff
    });

for(
    let i=0;
    i<9;
    i++
){

    const row=
        Math.floor(i/2);

    const side=
        i%2===0?-1:1;

    const d=
        getTrackSample(
            1590-row*17
        );

    const grid=
        new THREE.Mesh(
            new THREE.BoxGeometry(
                5,
                .025,
                2.5
            ),
            gridMaterial
        );

    grid.position.copy(d.p);

    grid.position.addScaledVector(
        d.normal,
        side*5
    );

    grid.position.y=.045;

    grid.rotation.y=
        Math.atan2(
            d.tangent.x,
            d.tangent.z
        );

    scene.add(grid);
}


/* =========================================================
   LIGHT POLES
   ========================================================= */

const poleMaterial=
    new THREE.MeshStandardMaterial({
        color:0x30343a,
        roughness:.7,
        metalness:.4
    });

const lampMaterial=
    new THREE.MeshBasicMaterial({
        color:0xfff7d2
    });

const poleGeometry=
    new THREE.CylinderGeometry(
        .09,
        .12,
        6,
        6
    );

const lampGeometry=
    new THREE.BoxGeometry(
        .45,
        .18,
        .25
    );

const lightGroup=
    new THREE.Group();

for(
    let i=0;
    i<TRACK_SAMPLES;
    i+=55
){

    const d=
        getTrackSample(i);

    const pos=
        d.p.clone()
            .addScaledVector(
                d.normal,
                TRACK_HALF_WIDTH+5
            );

    const pole=
        new THREE.Mesh(
            poleGeometry,
            poleMaterial
        );

    pole.position.copy(pos);
    pole.position.y=3;

    lightGroup.add(pole);

    const lamp=
        new THREE.Mesh(
            lampGeometry,
            lampMaterial
        );

    lamp.position.copy(pos);
    lamp.position.y=6;

    lamp.rotation.y=
        Math.atan2(
            d.tangent.x,
            d.tangent.z
        );

    lightGroup.add(lamp);
}

scene.add(lightGroup);


/* =========================================================
   LOCAL LIGHTS
   ========================================================= */

const localLightIndices=[
    0,
    190,
    390,
    590,
    790,

function distanceToTrackXZ(
    x,
    z
){

    let min=Infinity;

    for(
        let i=0;
        i<trackData.length;
        i+=12
    ){

        const dx=
            trackData[i].p.x-x;

        const dz=
            trackData[i].p.z-z;

        const dist=
            dx*dx+
            dz*dz;

        if(dist<min){
            min=dist;
        }
    }

    return Math.sqrt(min);
}

/* =========================================================
   RECOLOR CAR
   ========================================================= */

function recolorCar(
    object,
    color
){

    const bodyColor=
        new THREE.Color(color);

    object.traverse(
        child=>{

            if(!child.isMesh){
                return;
            }

            child.castShadow=true;
            child.receiveShadow=true;

            if(!child.material){
                return;
            }

            if(
                Array.isArray(
                    child.material
                )
            ){

                child.material=
                    child.material.map(
                        mat=>{

                            const cloned=
                                mat.clone();

                            if(cloned.color){

                                const brightness=
                                    (
                                        cloned.color.r+
                                        cloned.color.g+
                                        cloned.color.b
                                    )/3;

                                if(
                                    brightness>.12
                                ){

                                    cloned.color.lerp(
                                        bodyColor,
                                        .32
                                    );
                                }
                            }

                            return cloned;
                        }
                    );

            }else{

                const cloned=
                    child.material.clone();

                if(cloned.color){

                    const brightness=
                        (
                            cloned.color.r+
                            cloned.color.g+
                            cloned.color.b
                        )/3;

                    if(brightness>.12){

                        cloned.color.lerp(
                            bodyColor,
                            .32
                        );
                    }
                }

                child.material=cloned;
            }
        }
    );
}

/* =========================================================
   TRACK INFO
   ========================================================= */

function getTrackInfo(
    position
){

    let closestIndex=0;

    let closestDistance=
        Infinity;

    for(
        let i=0;
        i<TRACK_SAMPLES;
        i+=5
    ){

        const p=
            getTrackSample(i).p;

        const dx=
            position.x-p.x;

        const dz=
            position.z-p.z;

        const distance=
            dx*dx+
            dz*dz;

        if(
            distance<
            closestDistance
        ){

            closestDistance=
                distance;

            closestIndex=i;
        }
    }

    const d=
        getTrackSample(
            closestIndex
        );

    const offset=
        position.clone()
            .sub(d.p);

    const lateral=
        offset.dot(
            d.normal
        );

    return{

        index:closestIndex,

        distance:
            Math.sqrt(
                closestDistance
            ),

        lateral,

        sample:d
    };
}

/* =========================================================

let cameraMode=0;

const desiredCamera=
    new THREE.Vector3();

const lookTarget=
    new THREE.Vector3();


function updateCamera(dt){

    if(
        !Number.isFinite(
            player.position.x
        )||
        !Number.isFinite(
            player.position.y
        )||
        !Number.isFinite(
            player.position.z
        )
    ){

        player.position.copy(
            getTrackSample(0).p
        );

        player.position.y=0;

        physics.speed=0;

        physics.collisionVelocity.set(
            0,0,0
        );
    }

    if(
        !Number.isFinite(
            player.rotation.y
        )
    ){

        player.rotation.y=
            Math.atan2(
                getTrackSample(0).tangent.x,
                getTrackSample(0).tangent.z
            );
    }

    const speedAbs=
        Math.abs(
            physics.speed
        );

    const speedFactor=
        Math.min(
            speedAbs/80,
            1
        );

    const forward=
        new THREE.Vector3(
            Math.sin(
                player.rotation.y
            ),
            0,
            Math.cos(
                player.rotation.y
            )
        );

    if(cameraMode===0){

        const distance=
            15+
            speedFactor*6;

        const height=
            6.2+
            speedFactor*3.2;

        desiredCamera.copy(
            player.position
        );

        desiredCamera.addScaledVector(
            forward,
            -distance
        );

        desiredCamera.y+=height;

        lookTarget.copy(
            player.position
        );

        lookTarget.addScaledVector(
            forward,
            18+
            speedFactor*25
        );

        lookTarget.y+=1.7;

    }else if(cameraMode===1){

        const distance=
            25+
            speedFactor*10;

        const height=
            10+
            speedFactor*5;

        desiredCamera.copy(
            player.position
        );

        desiredCamera.addScaledVector(
            forward,
            -distance
        );

        desiredCamera.y+=height;

        lookTarget.copy(
            player.position
        );

        lookTarget.addScaledVector(
            forward,
            25+
            speedFactor*30
        );

        lookTarget.y+=2;

    }else{

        desiredCamera.copy(
            player.position
        );

        desiredCamera.addScaledVector(
            forward,
            1.2
        );

        desiredCamera.y+=2;

        lookTarget.copy(
            player.position
        );

        lookTarget.addScaledVector(
            forward,
            40
        );

        lookTarget.y+=2;
    }

    const smooth=
        1-Math.pow(
            .001,
            dt
        );

    camera.position.lerp(
        desiredCamera,
        smooth
    );

    if(
        Number.isFinite(
            lookTarget.x
        )&&
        Number.isFinite(
            lookTarget.y
        )&&
        Number.isFinite(
            lookTarget.z
        )
    ){

        camera.lookAt(
            lookTarget
        );
    }

    camera.fov=
        cameraMode===2
            ?73+
                speedFactor*7
            :68+
                speedFactor*14;

    camera.updateProjectionMatrix();
}


/* =========================================================
   PLAYER PHYSICS
   ========================================================= */

function updatePhysics(dt){

    physics.collisionCooldown=
        Math.max(
            0,
            physics.collisionCooldown-dt
        );

    if(
        !raceStarted||
        raceFinished
    ){

        physics.speed*=
            Math.pow(
                .92,
                dt*60
            );

        return;
    }

    const accelerating=
        keys.KeyW||
        keys.ArrowUp;

    const braking=
        keys.KeyS||
        keys.ArrowDown;

    const left=
        keys.KeyA||
        keys.ArrowLeft;

    const right=
        keys.KeyD||
        keys.ArrowRight;

    const speedKmh=
        Math.abs(
            physics.speed
        )*3.6;

    while(
        physics.gear<7&&
        speedKmh>
        gearLimits[
            physics.gear
        ]-5
    ){

        physics.gear++;
    }

    while(
        physics.gear>1&&
        speedKmh<
        gearLimits[
            physics.gear-1
        ]-12
    ){

        physics.gear--;
    }

    if(accelerating){

        const gearAccel=
            gearAcceleration[
                physics.gear
            ];

        const speedRatio=
            Math.min(
                Math.abs(
                    physics.speed
                )/
                (
                    physics.maxSpeed*.95
                ),
                1
            );

        let acceleration=
            gearAccel*
            (
                1-
                speedRatio*.55
            );

        if(
            keys.KeyE&&
            physics.ers>0
        ){

            acceleration+=4.8;

            physics.ers-=
                17*dt;

        }else{

            physics.ers+=
                4.5*dt;
        }

        physics.speed+=
            acceleration*dt;

    }else{

        physics.speed-=
            physics.speed*
            physics.rollingResistance*
            dt;
    }

    if(braking){

        if(
            physics.speed>0
        ){

            physics.speed-=
                physics.braking*dt;

            physics.brakeTemp+=
                65*dt;

        }else{

            physics.speed-=
                12*dt;
        }

    }else{

        physics.brakeTemp-=
            25*dt;
    }

    physics.drs=
        keys.Space&&
        physics.speed>27;

    if(physics.drs){

        physics.speed+=
            1.8*dt;
    }

    physics.ers=
        THREE.MathUtils.clamp(
            physics.ers,
            0,
            100
        );

    physics.brakeTemp=
        THREE.MathUtils.clamp(
            physics.brakeTemp,
            0,
            100
        );

    const maximum=
        physics.maxSpeed+
        (
            physics.drs
                ?5
                :0
        );

    physics.speed=
        THREE.MathUtils.clamp(
            physics.speed,
            -physics.reverseSpeed,
            maximum
        );

    let steeringInput=0;

    if(left){
        steeringInput-=1;
    }

    if(right){
        steeringInput+=1;
    }

    const steeringResponse=
        Math.abs(
            physics.speed
        )>55
            ?.22
            :.28;

    physics.steering=
        THREE.MathUtils.lerp(
            physics.steering,
            steeringInput,
            steeringResponse
        );

    const speedAbs=
        Math.abs(
            physics.speed
        );

    const speedFactor=
        Math.min(
            speedAbs/80,
            1
        );

    let yawRate=
        physics.steering*
        (
            .010+
            speedFactor*.028
        );

    if(speedAbs<20){
        yawRate*=1.45;
    }

    if(speedAbs>75){
        yawRate*=.90;
    }

    player.rotation.y-=
        yawRate*
        60*
        dt*
        (
            physics.speed>=0
                ?1
                :-1
        );

    const forward=
        new THREE.Vector3(
            Math.sin(
                player.rotation.y
            ),
            0,
            Math.cos(
                player.rotation.y
            )
        );

    player.position.addScaledVector(
        forward,
        physics.speed*dt
    );

    player.position.addScaledVector(
        physics.collisionVelocity,
        dt
    );

    physics.collisionVelocity.multiplyScalar(
        Math.pow(
            .025,
            dt
        )
    );

    const trackInfo=
        getTrackInfo(
            player.position
        );

    const lateralDistance=
        Math.abs(
            trackInfo.lateral
        );

    if(
        lateralDistance>
        TRACK_HALF_WIDTH+
        RUNOFF_WIDTH
    ){

        physics.speed*=
            Math.pow(
                .88,
                dt*60
            );
    }

    if(
        lateralDistance>
        WALL_DISTANCE-7
    ){

        physics.speed*=-.25;

        player.position.addScaledVector(
            trackInfo.sample.normal,
            -Math.sign(
                trackInfo.lateral
            )*.8
        );

        physics.collisionVelocity.copy(
            trackInfo.sample.normal
        ).multiplyScalar(
            -Math.sign(
                trackInfo.lateral
            )*5
        );
    }

    player.rotation.z=
        THREE.MathUtils.lerp(
            player.rotation.z,
            -physics.steering*.055,
            .08
        );

    player.rotation.x=
        THREE.MathUtils.lerp(
            player.rotation.x,
            accelerating
                ?-.025
                :braking
                    ?.045
                    :0,
            .08
        );

    if(
        !Number.isFinite(
            physics.speed
        )
    ){

        physics.speed=0;
    }

    if(
        !Number.isFinite(
            player.position.x
        )||
        !Number.isFinite(
            player.position.y
        )||
        !Number.isFinite(
            player.position.z
        )
    ){

        player.position.copy(
            getTrackSample(0).p
        );

        player.position.y=0;

        physics.speed=0;

        physics.collisionVelocity.set(
            0,0,0
        );
    }
}


/* =========================================================
   AI CORNER FACTOR
   ========================================================= */

function getCornerFactor(
    index
){

    const currentIndex=
        wrapTrackIndex(
            index
        );

    const aheadIndex=
        wrapTrackIndex(
            currentIndex+70
        );

    const current=
        getTrackSample(
            currentIndex
        );

    const ahead=
        getTrackSample(
            aheadIndex
        );

    if(
        !current||
        !ahead||
        !current.tangent||
        !ahead.tangent
    ){

        return 0;
    }

    const dot=
        THREE.MathUtils.clamp(
            current.tangent.dot(
                ahead.tangent
            ),
            -1,
            1
        );

    if(
        !Number.isFinite(dot)
    ){

        return 0;
    }

    return THREE.MathUtils.clamp(
        1-dot,
        0,
        1
    );
}


/* =========================================================
   FIND CLOSEST TRACK INDEX
   ========================================================= */

function findClosestTrackIndex(
    position,
    previousIndex=0
){

    const SEARCH_RADIUS=90;
    const SEARCH_STEP=2;

    let bestIndex=
        wrapTrackIndex(
            previousIndex
        );

    let bestDistance=
        Infinity;

    for(
        let offset=-SEARCH_RADIUS;
        offset<=SEARCH_RADIUS;
        offset+=SEARCH_STEP
    ){

        const index=
            wrapTrackIndex(
                previousIndex+
                offset
            );

        const p=
            trackData[index].p;

        const dx=
            position.x-p.x;

        const dz=
            position.z-p.z;

        const distance=
            dx*dx+
            dz*dz;

        if(
            distance<
            bestDistance
        ){

            bestDistance=distance;
            bestIndex=index;
        }
    }

    if(
        bestDistance>1600
    ){

        for(
            let i=0;
            i<TRACK_SAMPLES;
            i+=10
        ){

            const p=
                trackData[i].p;

            const dx=
                position.x-p.x;

            const dz=
                position.z-p.z;

            const distance=
                dx*dx+
                dz*dz;

            if(
                distance<
                bestDistance
            ){

                bestDistance=distance;
                bestIndex=i;
            }
        }
    }

    return bestIndex;
}


/* =========================================================
   AI PHYSICS
   ========================================================= */

function updateAI(dt){

    if(
        !raceStarted||
        raceFinished
    ){
        return;
    }

    for(
        const ai of aiCars
    ){

        if(
            !ai||
            !ai.mesh||
            ai.finished
        ){
            continue;
        }

        ai.collisionCooldown=
            Math.max(
                0,
                ai.collisionCooldown-dt
            );

        if(
            !Number.isFinite(
                ai.index
            )
        ){

            ai.index=
                ai.startIndex;
        }

        const actualIndex=
            findClosestTrackIndex(
                ai.mesh.position,
                ai.index
            );

        const previousIndex=
            wrapTrackIndex(
                ai.index
            );

        ai.index=
            actualIndex;

        const cornerFactor=
            getCornerFactor(
                actualIndex
            );

        let targetSpeed=
            ai.topSpeed-
            cornerFactor*42;

        targetSpeed=
            THREE.MathUtils.clamp(
                targetSpeed,
                43,
                ai.topSpeed
            );

        targetSpeed+=
            Math.sin(
                performance.now()*.0007+
                actualIndex*.01
            )*.7;

        ai.targetSpeed=
            targetSpeed;

        if(
            ai.speed<
            ai.targetSpeed
        ){

            ai.speed+=
                (
                    17+
                    ai.skill*3
                )*dt;

        }else{

            ai.speed-=
                (
                    28+
                    ai.skill*10
                )*dt;
        }

        ai.speed=
            THREE.MathUtils.clamp(
                ai.speed,
                0,
                ai.topSpeed
            );

        const lookAheadSamples=
            Math.floor(
                THREE.MathUtils.clamp(
                    25+
                    ai.speed*.45,
                    25,
                    75
                )
            );

        const targetIndex=
            wrapTrackIndex(
                actualIndex+
                lookAheadSamples
            );

        const targetData=
            getTrackSample(
                targetIndex
            );

        const currentData=
            getTrackSample(
                actualIndex
            );

        const target=
            targetData.p.clone();

        target.addScaledVector(
            targetData.normal,
            ai.lane
        );

        const toTarget=
            new THREE.Vector3(
                target.x-
                ai.mesh.position.x,
                0,
                target.z-
                ai.mesh.position.z
            );

        const targetDistance=
            Math.max(
                toTarget.length(),
                .001
            );

        toTarget.normalize();

        const desiredAngle=
            Math.atan2(
                toTarget.x,
                toTarget.z
            );

        let angleError=
            desiredAngle-
            ai.mesh.rotation.y;

        while(
            angleError>Math.PI
        ){

            angleError-=
                Math.PI*2;
        }

        while(
            angleError<-Math.PI
        ){

            angleError+=
                Math.PI*2;
        }

        const distanceCorrection=
            THREE.MathUtils.clamp(
                targetDistance/15,
                .35,
                2.0
            );

        const speedSteering=
            THREE.MathUtils.clamp(
                1.55-
                ai.speed*.008,
                .75,
                1.55
            );

        const steeringRate=
            speedSteering*
            distanceCorrection;

        const maxTurnRate=
            THREE.MathUtils.lerp(
                2.2,
                1.15,
                THREE.MathUtils.clamp(
                    ai.speed/84,
                    0,
                    1
                )
            );

        const turn=
            THREE.MathUtils.clamp(
                angleError*
                steeringRate,
                -maxTurnRate,
                maxTurnRate
            );

        ai.mesh.rotation.y+=
            turn*dt;

        const lateralOffset=
            ai.mesh.position.clone()
                .sub(currentData.p)
                .dot(currentData.normal);

        const tangentAngle=
            Math.atan2(
                currentData.tangent.x,
                currentData.tangent.z
            );

        let tangentError=
            tangentAngle-
            ai.mesh.rotation.y;

        while(
            tangentError>Math.PI
        ){

            tangentError-=
                Math.PI*2;
        }

        while(
            tangentError<-Math.PI
        ){

            tangentError+=
                Math.PI*2;
        }

        const tangentBlend=
            THREE.MathUtils.clamp(
                1-
                Math.abs(
                    lateralOffset
                )/18,
                .08,
                .42
            );

        ai.mesh.rotation.y=
            THREE.MathUtils.lerp(
                ai.mesh.rotation.y,
                ai.mesh.rotation.y+
                tangentError,
                tangentBlend*
                Math.min(
                    dt*4,
                    1
                )
            );

        const forward=
            new THREE.Vector3(
                Math.sin(
                    ai.mesh.rotation.y
                ),
                0,
                Math.cos(
                    ai.mesh.rotation.y
                )
            );

        const oldPosition=
            ai.mesh.position.clone();

        ai.mesh.position.addScaledVector(
            forward,
            ai.speed*dt
        );

        ai.mesh.position.addScaledVector(
            ai.collisionVelocity,
            dt
        );

        ai.collisionVelocity.multiplyScalar(
            Math.pow(
                .025,
                dt
            )
        );

        const movementDistance=
            Math.sqrt(
                Math.pow(
                    ai.mesh.position.x-
                    oldPosition.x,
                    2
                )+
                Math.pow(
                    ai.mesh.position.z-
                    oldPosition.z,
                    2
                )
            );

        if(
            Number.isFinite(
                movementDistance
            )
        ){

            ai.distanceTravelled+=
                movementDistance;
        }

        const newIndex=
            findClosestTrackIndex(
                ai.mesh.position,
                actualIndex
            );

        /*
           FIXED LAP DETECTION

           The AI begins around sample 1590
           and drives forward toward sample 0.
           Only count a lap when it genuinely
           wraps from the end of the circuit
           back to the beginning.
        */

        const crossedStart=
            actualIndex>1400&&
            newIndex<200;

        if(crossedStart){

            ai.lap++;

            if(
                ai.lap>
                TOTAL_LAPS
            ){

                ai.finished=true;
                ai.finishTime=
                    performance.now()-
                    raceStartTime;

                ai.speed=0;

                ai.index=0;

                continue;
            }
        }

        ai.index=
            wrapTrackIndex(
                newIndex
            );

        const info=
            getTrackInfo(
                ai.mesh.position
            );

        const maxRoadOffset=
            TRACK_HALF_WIDTH+
            RUNOFF_WIDTH;

        if(
            Math.abs(
                info.lateral
            )>
            maxRoadOffset
        ){

            const recoveryTarget=
                info.sample.p.clone()
                    .addScaledVector(
                        info.sample.normal,
                        ai.lane
                    );

            ai.mesh.position.lerp(
                recoveryTarget,
                Math.min(
                    1,
                    dt*3.5
                )
            );

            ai.speed*=
                Math.pow(
                    .82,
                    dt*60
                );
        }

        ai.mesh.rotation.z=
            THREE.MathUtils.lerp(
                ai.mesh.rotation.z,
                -turn*.035,
                Math.min(
                    1,
                    dt*6
                )
            );

        ai.mesh.rotation.x=
            THREE.MathUtils.lerp(
                ai.mesh.rotation.x,
                0,
                Math.min(
                    1,
                    dt*6
                )
            );

        ai.lastIndex=
            ai.index;

        if(
            !Number.isFinite(
                ai.speed
            )
        ){

            ai.speed=0;
        }

        if(
            !Number.isFinite(
                ai.index
            )
        ){

            ai.index=
                actualIndex;
        }

        if(
            !Number.isFinite(
                ai.mesh.position.x
            )||
            !Number.isFinite(
                ai.mesh.position.y
            )||
            !Number.isFinite(
                ai.mesh.position.z
            )
        ){

            const safeData=
                getTrackSample(
                    actualIndex
                );

            ai.mesh.position.copy(
                safeData.p
            );

            ai.mesh.position.addScaledVector(
                safeData.normal,
                ai.lane
            );

            ai.mesh.position.y=0;

            ai.speed=0;

            ai.collisionVelocity.set(
                0,0,0
            );
        }

        if(
            !Number.isFinite(
                ai.mesh.rotation.y
            )
        ){

            const safeData=
                getTrackSample(
                    actualIndex
                );

            ai.mesh.rotation.y=
                Math.atan2(
                    safeData.tangent.x,
                    safeData.tangent.z
                );
        }
    }
}


/* =========================================================
   HITBOX
   ========================================================= */

const CAR_HALF_LENGTH=2.65;
const CAR_HALF_WIDTH=1.30;


/* =========================================================
   CAR AXES
   ========================================================= */

function getCarAxes(
    object
){

    const angle=
        object.rotation.y;

    const forward=
        new THREE.Vector2(
            Math.sin(angle),
            Math.cos(angle)
        );

    const right=
        new THREE.Vector2(
            Math.cos(angle),
            -Math.sin(angle)
        );

    return{
        forward,
        right
    };
}


/* =========================================================
   PROJECT HITBOX
   ========================================================= */

function projectCar(
    object,
    axis
){

    const axes=
        getCarAxes(
            object
        );

    return(
        Math.abs(
            axes.forward.dot(axis)
        )*
        CAR_HALF_LENGTH+
        Math.abs(
            axes.right.dot(axis)
        )*
        CAR_HALF_WIDTH
    );
}


/* =========================================================
   OBB COLLISION
   ========================================================= */

function testCarCollision(
    carA,
    carB
){

    if(
        !carA||
        !carB
    ){
        return null;
    }

    const dx=
        carB.position.x-
        carA.position.x;

    const dz=
        carB.position.z-
        carA.position.z;

    const distanceSquared=
        dx*dx+
        dz*dz;

    if(
        distanceSquared>90
    ){
        return null;
    }

    const axesA=
        getCarAxes(carA);

    const axesB=
        getCarAxes(carB);

    const testAxes=[

        axesA.forward,
        axesA.right,
        axesB.forward,
        axesB.right

    ];

    const delta=
        new THREE.Vector2(
            dx,
            dz
        );

    let smallestOverlap=
        Infinity;

    let collisionAxis=null;

    for(
        const axis of testAxes
    ){

        const distance=
            Math.abs(
                delta.dot(axis)
            );

        const radiusA=
            projectCar(
                carA,
                axis
            );

        const radiusB=
            projectCar(
                carB,
                axis
            );

        const overlap=
            radiusA+
            radiusB-
            distance;

        if(
            overlap<=0
        ){
            return null;
        }

        if(
            overlap<
            smallestOverlap
        ){

            smallestOverlap=
                overlap;

            collisionAxis=
                axis.clone();
        }
    }

    if(
        !collisionAxis||
        !Number.isFinite(
            smallestOverlap
        )
    ){

        return null;
    }

    if(
        delta.dot(
            collisionAxis
        )<0
    ){

        collisionAxis.negate();
    }

    return{

        normal:collisionAxis,

        penetration:
            THREE.MathUtils.clamp(
                smallestOverlap,
                0,
                3
            )
    };
}


/* =========================================================
   COLLISION RESPONSE
   ========================================================= */

function applyCollision(
    carA,
    velocityA,
    carB,
    velocityB,
    collision,
    cooldownA,
    cooldownB
){

    if(!collision){
        return false;
    }

    const normal=
        collision.normal.clone();

    if(
        !Number.isFinite(normal.x)||
        !Number.isFinite(normal.y)
    ){

        return false;
    }

    const separation=
        THREE.MathUtils.clamp(
            collision.penetration+.04,
            .04,
            1.25
        );

    carA.position.x-=
        normal.x*
        separation*.5;

    carA.position.z-=
        normal.y*
        separation*.5;

    carB.position.x+=
        normal.x*
        separation*.5;

    carB.position.z+=
        normal.y*
        separation*.5;

    const relativeVelocity=
        velocityB.clone()
            .sub(
                velocityA
            );

    let closingSpeed=
        relativeVelocity.dot(
            normal
        );

    if(
        !Number.isFinite(
            closingSpeed
        )
    ){

        closingSpeed=0;
    }

    if(
        closingSpeed>=0
    ){

        cooldownA();
        cooldownB();

        return true;
    }

    closingSpeed=
        THREE.MathUtils.clamp(
            closingSpeed,
            -22,
            0
        );

    const restitution=.42;

    let impulseMagnitude=
        -(1+restitution)*
        closingSpeed/
        2;

    impulseMagnitude=
        THREE.MathUtils.clamp(
            impulseMagnitude,
            0,
            8
        );

    const impulse=
        normal.clone()
            .multiplyScalar(
                impulseMagnitude
            );

    velocityA.sub(
        impulse
    );

    velocityB.add(
        impulse
    );

    const tangent=
        new THREE.Vector2(
            -normal.y,
            normal.x
        );

    const lateralVelocity=
        relativeVelocity.dot(
            tangent
        );

    const lateralKick=
        THREE.MathUtils.clamp(
            lateralVelocity*.06,
            -3.5,
            3.5
        );

    velocityA.x-=
        tangent.x*
        lateralKick;

    velocityA.z-=
        tangent.y*
        lateralKick;

    velocityB.x+=
        tangent.x*
        lateralKick;

    velocityB.z+=
        tangent.y*
        lateralKick;

    velocityA.x=
        THREE.MathUtils.clamp(
            velocityA.x,
            -105,
            105
        );

    velocityA.z=
        THREE.MathUtils.clamp(
            velocityA.z,
            -105,
            105
        );

    velocityB.x=
        THREE.MathUtils.clamp(
            velocityB.x,
            -105,
            105
        );

    velocityB.z=
        THREE.MathUtils.clamp(
            velocityB.z,
            -105,
            105
        );

    cooldownA();
    cooldownB();

    return true;
}


/* =========================================================
   PLAYER / AI COLLISIONS
   ========================================================= */

function updatePlayerAICollisions(){

    if(
        !raceStarted||
        physics.collisionCooldown>0
    ){

        return;
    }

    const playerForward=
        new THREE.Vector3(
            Math.sin(
                player.rotation.y
            ),
            0,
            Math.cos(
                player.rotation.y
            )
        );

    for(
        const ai of aiCars
    ){

        if(
            !ai||
            !ai.mesh||
            ai.collisionCooldown>0
        ){
            continue;
        }

        const collision=
            testCarCollision(
                player,
                ai.mesh
            );

        if(!collision){
            continue;
        }

        const playerVelocity=
            playerForward.clone()
                .multiplyScalar(
                    THREE.MathUtils.clamp(
                        physics.speed,
                        -physics.reverseSpeed,
                        physics.maxSpeed
                    )
                );

        const aiForward=
            new THREE.Vector3(
                Math.sin(
                    ai.mesh.rotation.y
                ),
                0,
                Math.cos(
                    ai.mesh.rotation.y
                )
            );

        const aiVelocity=
            aiForward.clone()
                .multiplyScalar(
                    THREE.MathUtils.clamp(
                        ai.speed,
                        0,
                        ai.topSpeed
                    )
                );

        applyCollision(

            player,
            playerVelocity,

            ai.mesh,
            aiVelocity,

            collision,

            ()=>{
                physics.collisionCooldown=.28;
            },

            ()=>{
                ai.collisionCooldown=.28;
            }
        );

        const newPlayerSpeed=
            playerVelocity.dot(
                playerForward
            );

        physics.speed=
            THREE.MathUtils.clamp(
                newPlayerSpeed,
                -physics.reverseSpeed,
                physics.maxSpeed
            );

        const playerLateral=
            playerVelocity.clone();

        playerLateral.sub(
            playerForward.clone()
                .multiplyScalar(
                    playerVelocity.dot(
                        playerForward
                    )
                )
        );

        physics.collisionVelocity.copy(
            playerLateral
        );

        physics.collisionVelocity.multiplyScalar(
            .45
        );

        const aiForwardSpeed=
            aiVelocity.dot(
                aiForward
            );

        ai.speed=
            THREE.MathUtils.clamp(
                aiForwardSpeed,
                0,
                ai.topSpeed
            );

        const aiLateral=
            aiVelocity.clone();

        aiLateral.sub(
            aiForward.clone()
                .multiplyScalar(
                    aiVelocity.dot(
                        aiForward
                    )
                )
        );

        ai.collisionVelocity.copy(
            aiLateral
        );

        ai.collisionVelocity.multiplyScalar(
            .45
        );

        if(
            !Number.isFinite(
                player.position.x
            )||
            !Number.isFinite(
                player.position.z
            )
        ){

            player.position.copy(
                getTrackSample(0).p
            );

            player.position.y=0;

            physics.speed=0;

            physics.collisionVelocity.set(
                0,0,0
            );
        }

        if(
            !Number.isFinite(
                ai.mesh.position.x
            )||
            !Number.isFinite(
                ai.mesh.position.z
            )
        ){

            ai.mesh.position.copy(
                getTrackSample(
                    ai.index
                ).p
            );

            ai.mesh.position.y=0;

            ai.speed=0;

            ai.collisionVelocity.set(
                0,0,0
            );
        }

        break;
    }
}


/* =========================================================
   AI / AI COLLISIONS
   ========================================================= */

function updateAICollisions(){

    if(!raceStarted){
        return;
    }

    for(
        let i=0;
        i<aiCars.length;
        i++
    ){

        for(
            let j=i+1;
            j<aiCars.length;
            j++
        ){

            const a=
                aiCars[i];

            const b=
                aiCars[j];

            if(
                !a||
                !b||
                !a.mesh||
                !b.mesh
            ){
                continue;
            }

            if(
                a.collisionCooldown>0||
                b.collisionCooldown>0
            ){
                continue;
            }

            const collision=
                testCarCollision(
                    a.mesh,
                    b.mesh
                );

            if(!collision){
                continue;
            }

            const forwardA=
                new THREE.Vector3(
                    Math.sin(
                        a.mesh.rotation.y
                    ),
                    0,
                    Math.cos(
                        a.mesh.rotation.y
                    )
                );

            const forwardB=
                new THREE.Vector3(
                    Math.sin(
                        b.mesh.rotation.y
                    ),
                    0,
                    Math.cos(
                        b.mesh.rotation.y
                    )
                );

            const velocityA=
                forwardA.clone()
                    .multiplyScalar(
                        THREE.MathUtils.clamp(
                            a.speed,
                            0,
                            a.topSpeed
                        )
                    );

            const velocityB=
                forwardB.clone()
                    .multiplyScalar(
                        THREE.MathUtils.clamp(
                            b.speed,
                            0,
                            b.topSpeed
                        )
                    );

            applyCollision(

                a.mesh,
                velocityA,

                b.mesh,
                velocityB,

                collision,

                ()=>{
                    a.collisionCooldown=.28;
                },

                ()=>{
                    b.collisionCooldown=.28;
                }
            );

            a.speed=
                THREE.MathUtils.clamp(
                    velocityA.dot(
                        forwardA
                    ),
                    0,
                    a.topSpeed
                );

            b.speed=
                THREE.MathUtils.clamp(
                    velocityB.dot(
                        forwardB
                    ),
                    0,
                    b.topSpeed
                );

            const lateralA=
                velocityA.clone()
                    .sub(
                        forwardA.clone()
                            .multiplyScalar(
                                velocityA.dot(
                                    forwardA
                                )
                            )
                    );

            a.collisionVelocity.copy(
                lateralA
            );

            a.collisionVelocity.multiplyScalar(
                .45
            );

            const lateralB=
                velocityB.clone()
                    .sub(
                        forwardB.clone()
                            .multiplyScalar(
                                velocityB.dot(
                                    forwardB
                                )
                            )
                    );

            b.collisionVelocity.copy(
                lateralB
            );

            b.collisionVelocity.multiplyScalar(
                .45
            );

            if(
                !Number.isFinite(
                    a.mesh.position.x
                )||
                !Number.isFinite(
                    a.mesh.position.z
                )
            ){

                a.mesh.position.copy(
                    getTrackSample(
                        a.index
                    ).p
                );

                a.speed=0;

                a.collisionVelocity.set(
                    0,0,0
                );
            }

            if(
                !Number.isFinite(
                    b.mesh.position.x
                )||
                !Number.isFinite(
                    b.mesh.position.z
                )
            ){

                b.mesh.position.copy(
                    getTrackSample(
                        b.index
                    ).p
                );

                b.speed=0;

                b.collisionVelocity.set(
                    0,0,0
                );
            }
        }
    }
}


/* =========================================================
   LAP SYSTEM
   ========================================================= */

function updateLapSystem(dt){

    if(
        !raceStarted||
        raceFinished
    ){
        return;
    }

    lapCrossCooldown-=dt;

    const startPosition=
        getTrackSample(0).p;

    const dx=
        player.position.x-
        startPosition.x;

    const dz=
        player.position.z-
        startPosition.z;

    const distanceFromStart=
        Math.sqrt(
            dx*dx+
            dz*dz
        );

    if(
        !hasLeftStart&&
        distanceFromStart>100
    ){

        hasLeftStart=true;
    }

    if(
        hasLeftStart&&
        distanceFromStart<30&&
        Math.abs(
            physics.speed
        )>8&&
        lapCrossCooldown<=0
    ){

        const now=
            performance.now();

        const lapTime=
            now-
            lapStartTime;

        if(
            lapTime>10000
        ){

            currentLap++;

            lapStartTime=now;

            hasLeftStart=false;

            lapCrossCooldown=3;

            if(
                currentLap>
                TOTAL_LAPS
            ){

                finishRace();
            }
        }
    }
}


/* =========================================================
   RACE PROGRESS
   ========================================================= */

/*
   IMPORTANT:

   The AI starts around sample 1590 while
   the player starts at sample 0.

   Using raw track sample numbers caused
   the position system to think the AI was
   already far ahead.

   We now measure every car from ITS OWN
   starting grid position.

   Player:
       start index = 0

   AI:
       start index = its actual grid index

   Once a car crosses the start line,
   its lap count increases.

   This creates one continuous race
   progress value for classification.
*/


function getRelativeTrackProgress(
    index,
    startIndex
){

    const safeIndex=
        wrapTrackIndex(index);

    const safeStart=
        wrapTrackIndex(startIndex);

    let progress=
        trackDistance[safeIndex]-
        trackDistance[safeStart];

    if(progress<0){

        progress+=TRACK_LENGTH;
    }

    return THREE.MathUtils.clamp(
        progress,
        0,
        TRACK_LENGTH
    );
}


function getPlayerRaceProgress(){

    const info=
        getTrackInfo(
            player.position
        );

    const lapProgress=
        getRelativeTrackProgress(
            info.index,
            0
        );

    return(
        Math.max(
            currentLap-1,
            0
        )*
        TRACK_LENGTH+
        lapProgress
    );
}


function getAIRaceProgress(
    ai
){

    if(!ai){
        return 0;
    }

    const lapProgress=
        getRelativeTrackProgress(
            ai.index,
            ai.startIndex
        );

    return(
        Math.max(
            ai.lap-1,
            0
        )*
        TRACK_LENGTH+
        lapProgress
    );
}


/* =========================================================
   CLASSIFICATION
   ========================================================= */

function getRaceStandings(){

    const entries=[

        {
            name:"YOU",
            isPlayer:true,
            progress:
                getPlayerRaceProgress(),
            finished:
                raceFinished,
            finishTime:
                playerFinishTime
        }

    ];

    aiCars.forEach(
        (ai,i)=>{

            entries.push({

                name:
                    `AI ${i+1}`,

                isPlayer:false,

                progress:
                    getAIRaceProgress(
                        ai
                    ),

                finished:
                    ai.finished,

                finishTime:
                    ai.finishTime

            });
        }
    );

    entries.sort(
        (a,b)=>{

            /*
               Finished cars always appear
               above cars still racing.
            */

            if(
                a.finished!==
                b.finished
            ){

                return a.finished
                    ?-1
                    :1;
            }

            /*
               Among finished cars, actual
               finish time determines order.
            */

            if(
                a.finished&&
                b.finished
            ){

                const aTime=
                    Number.isFinite(
                        a.finishTime
                    )
                        ?a.finishTime
                        :Infinity;

                const bTime=
                    Number.isFinite(
                        b.finishTime
                    )
                        ?b.finishTime
                        :Infinity;

                if(
                    aTime!==bTime
                ){

                    return aTime-bTime;
                }
            }

            /*
               Otherwise use continuous
               race progress.
            */

            return(
                b.progress-
                a.progress
            );
        }
    );

    return entries;
}


/* =========================================================
   POSITION
   ========================================================= */

function getRacePosition(){

    const standings=
        getRaceStandings();

    const playerIndex=
        standings.findIndex(
            entry=>entry.isPlayer
        );

    if(
        playerIndex<0
    ){
        return 1;
    }

    return playerIndex+1;
}


/* =========================================================
   FORMAT TIME
   ========================================================= */

function formatTime(
    milliseconds
){

    const totalSeconds=
        Math.max(
            0,
            milliseconds
        )/1000;

    const minutes=
        Math.floor(
            totalSeconds/60
        );

    const seconds=
        totalSeconds%60;

    return(
        String(
            minutes
        ).padStart(2,"0")+
        ":"+
        seconds
            .toFixed(3)
            .padStart(6,"0")
    );
}


/* =========================================================
   FORMAT GAP
   ========================================================= */

function formatGap(
    entry,
    standings
){

    if(entry.isPlayer){
        return "YOU";
    }

    if(entry.finished){

        if(
            entry.finishTime!=null
        ){

            const playerEntry=
                standings.find(
                    e=>e.isPlayer
                );

            if(
                playerEntry&&
                playerEntry.finished&&
                playerEntry.finishTime!=null
            ){

                const gap=
                    entry.finishTime-
                    playerEntry.finishTime;

                if(
                    Math.abs(gap)<1
                ){
                    return "FINISH";
                }

                return gap>0
                    ?`+${formatTime(gap)}`
                    :formatTime(
                        Math.abs(gap)
                    );
            }

            return "FINISH";
        }

        return "FINISH";
    }

    const playerEntry=
        standings.find(
            e=>e.isPlayer
        );

    if(!playerEntry){
        return "";
    }

    const difference=
        entry.progress-
        playerEntry.progress;

    if(
        Math.abs(difference)<1
    ){

        return "—";
    }

    if(
        difference>0
    ){

        return(
            "+"+
            Math.round(
                difference
            )+
            "m"
        );
    }

    return(
        Math.round(
            Math.abs(
                difference
            )
        )+
        "m"
    );
}

/* =========================================================
   FINISH RACE
   ========================================================= */

function finishRace(){

    if(raceFinished){
        return;
    }

    raceFinished=true;

    raceStarted=false;

    playerFinishTime=
        performance.now()-
        raceStartTime;

    physics.speed=0;

    physics.steering=0;

    physics.drs=false;

    finalResults=
        getRaceStandings();

    showFinishLeaderboard();
}

    const list=
