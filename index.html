/* =========================================================
   MINI MAP
   ========================================================= */

const miniMapCanvas=
    document.getElementById(
        "miniMapCanvas"
    );

const miniMapCtx=
    miniMapCanvas.getContext(
        "2d"
    );


function resizeMiniMap(){

    const rect=
        miniMapCanvas.getBoundingClientRect();

    const dpr=
        Math.min(
            window.devicePixelRatio||1,
            2
        );

    miniMapCanvas.width=
        Math.max(
            1,
            Math.floor(
                rect.width*dpr
            )
        );

    miniMapCanvas.height=
        Math.max(
            1,
            Math.floor(
                rect.height*dpr
            )
        );

    miniMapCtx.setTransform(
        dpr,
        0,
        0,
        dpr,
        0,
        0
    );
}


/*
   Build a 2D projection of the circuit once.
*/

const mapPoints=[];

let mapMinX=Infinity;
let mapMaxX=-Infinity;
let mapMinZ=Infinity;
let mapMaxZ=-Infinity;

for(
    let i=0;
    i<TRACK_SAMPLES;
    i+=2
){

    const p=
        trackData[i].p;

    mapPoints.push({
        x:p.x,
        z:p.z
    });

    mapMinX=
        Math.min(
            mapMinX,
            p.x
        );

    mapMaxX=
        Math.max(
            mapMaxX,
            p.x
        );

    mapMinZ=
        Math.min(
            mapMinZ,
            p.z
        );

    mapMaxZ=
        Math.max(
            mapMaxZ,
            p.z
        );
}


function mapWorldToCanvas(
    x,
    z
){

    const width=
        miniMapCanvas.clientWidth;

    const height=
        miniMapCanvas.clientHeight;

    const padding=16;

    const worldWidth=
        mapMaxX-
        mapMinX;

    const worldHeight=
        mapMaxZ-
        mapMinZ;

    const scale=
        Math.min(
            (width-padding*2)/
                worldWidth,
            (height-padding*2)/
                worldHeight
        );

    const usedWidth=
        worldWidth*scale;

    const usedHeight=
        worldHeight*scale;

    const offsetX=
        (width-usedWidth)/2;

    const offsetY=
        (height-usedHeight)/2;

    return{

        x:
            offsetX+
            (x-mapMinX)*
            scale,

        y:
            offsetY+
            (z-mapMinZ)*
            scale

    };
}


/* =========================================================
   DRAW MINIMAP
   ========================================================= */

function drawMiniMap(){

    const width=
        miniMapCanvas.clientWidth;

    const height=
        miniMapCanvas.clientHeight;

    if(
        width<=0||
        height<=0
    ){
        return;
    }

    miniMapCtx.clearRect(
        0,
        0,
        width,
        height
    );

    /*
       Circuit outline
    */

    miniMapCtx.beginPath();

    mapPoints.forEach(
        (point,i)=>{

            const screen=
                mapWorldToCanvas(
                    point.x,
                    point.z
                );

            if(i===0){

                miniMapCtx.moveTo(
                    screen.x,
                    screen.y
                );

            }else{

                miniMapCtx.lineTo(
                    screen.x,
                    screen.y
                );
            }
        }
    );

    miniMapCtx.closePath();

    /*
       Runoff / circuit border
    */

    miniMapCtx.lineWidth=10;

    miniMapCtx.strokeStyle=
        "rgba(120,128,135,.9)";

    miniMapCtx.stroke();

    /*
       Asphalt
    */

    miniMapCtx.beginPath();

    mapPoints.forEach(
        (point,i)=>{

            const screen=
                mapWorldToCanvas(
                    point.x,
                    point.z
                );

            if(i===0){

                miniMapCtx.moveTo(
                    screen.x,
                    screen.y
                );

            }else{

                miniMapCtx.lineTo(
                    screen.x,
                    screen.y
                );
            }
        }
    );

    miniMapCtx.closePath();

    miniMapCtx.lineWidth=5;

    miniMapCtx.strokeStyle=
        "#30343a";

    miniMapCtx.stroke();

    /*
       Start/finish marker
    */

    const startPoint=
        getTrackSample(0).p;

    const startScreen=
        mapWorldToCanvas(
            startPoint.x,
            startPoint.z
        );

    miniMapCtx.fillStyle=
        "rgba(255,255,255,.9)";

    miniMapCtx.fillRect(
        startScreen.x-2,
        startScreen.y-2,
        4,
        4
    );

    /*
       AI cars
    */

    for(
        const ai of aiCars
    ){

        if(
            !ai||
            !ai.mesh
        ){
            continue;
        }

        const p=
            ai.mesh.position;

        const screen=
            mapWorldToCanvas(
                p.x,
                p.z
            );

        miniMapCtx.beginPath();

        miniMapCtx.arc(
            screen.x,
            screen.y,
            3.2,
            0,
            Math.PI*2
        );

        miniMapCtx.fillStyle=
            ai.finished
                ?"rgba(255,80,80,.55)"
                :"#e53935";

        miniMapCtx.fill();
    }

    /*
       Player
    */

    const playerScreen=
        mapWorldToCanvas(
            player.position.x,
            player.position.z
        );

    miniMapCtx.beginPath();

    miniMapCtx.arc(
        playerScreen.x,
        playerScreen.y,
        4.5,
        0,
        Math.PI*2
    );

    miniMapCtx.fillStyle=
        "#38e66d";

    miniMapCtx.fill();

    miniMapCtx.lineWidth=1.5;

    miniMapCtx.strokeStyle=
        "rgba(255,255,255,.9)";

    miniMapCtx.stroke();
}


/* =========================================================
   HUD
   ========================================================= */

function updateHUD(){

    const safeSpeed=
        Number.isFinite(
            physics.speed
        )
            ?physics.speed
            :0;

    const speed=
        Math.round(
            Math.abs(
                safeSpeed
            )*3.6
        );

    document.getElementById(
        "speed"
    ).textContent=
        speed;

    document.getElementById(
        "gear"
    ).textContent=
        safeSpeed<-1
            ?"R"
            :physics.gear;

    document.getElementById(
        "lap"
    ).textContent=
        `LAP ${
            Math.min(
                currentLap,
                TOTAL_LAPS
            )
        } / ${TOTAL_LAPS}`;

    let lapTime=0;

    if(raceStarted){

        lapTime=
            performance.now()-
            lapStartTime;
    }

    document.getElementById(
        "lapTime"
    ).textContent=
        formatTime(
            lapTime
        );

    document.getElementById(
        "drsState"
    ).textContent=
        physics.drs
            ?"ACTIVE"
            :"OFF";

    document.getElementById(
        "ersState"
    ).textContent=
        Math.round(
            physics.ers
        )+
        "%";

    document.getElementById(
        "brakeState"
    ).textContent=
        Math.round(
            physics.brakeTemp
        )+
        "%";

        "position"
    ).textContent=

/* =========================================================
   RESET AI
   ========================================================= */

function resetAICars(){

    aiCars.forEach(
        (ai,i)=>{

            const row=
                Math.floor(i/2);

            const side=
                i%2===0?-1:1;

            const startIndex=
                getAIStartIndex(i);

            const d=
                getTrackSample(
                    startIndex
                );

            ai.startIndex=
                startIndex;

            ai.index=
                startIndex;

            ai.lastIndex=
                startIndex;

            ai.lap=1;

            ai.lane=
                side*5;

            ai.speed=0;

            ai.targetSpeed=0;

            ai.collisionCooldown=0;

            ai.collisionVelocity.set(
                0,0,0
            );

            ai.finished=false;

            ai.finishTime=null;

            ai.distanceTravelled=0;

            ai.lastPosition=
                d.p.clone();

            ai.mesh.position.copy(
                d.p
            );

            ai.mesh.position.addScaledVector(
                d.normal,
                ai.lane
            );

            ai.mesh.position.y=0;

            ai.mesh.rotation.set(
                0,
                Math.atan2(
                    d.tangent.x,
                    d.tangent.z
                ),
                0
            );
        }
    );
}


/* =========================================================
   RESTART
   ========================================================= */

function restartRace(){

    if(countdownTimer){

        clearInterval(
            countdownTimer
        );

        countdownTimer=null;
    }

    physics.speed=0;

    physics.steering=0;

    physics.gear=1;

    physics.ers=100;

    physics.brakeTemp=0;

    physics.drs=false;

    physics.collisionVelocity.set(
        0,0,0
    );

    physics.collisionCooldown=0;

    currentLap=1;

    hasLeftStart=false;

    lapCrossCooldown=3;

    raceStarted=false;

    raceFinished=false;

    raceStartTime=0;

    lapStartTime=0;

    playerFinishTime=null;

    finalResults=[];

    const startData=
        getTrackSample(0);

    player.position.copy(
        startData.p
    );

    player.position.y=0;

    player.rotation.set(
        0,
        Math.atan2(
            startData.tangent.x,
            startData.tangent.z
        ),
        0
    );

    resetAICars();

    document.getElementById(
        "message"
    ).style.display=
        "none";

    document.getElementById(
        "finishOverlay"
    ).classList.add(
        "hidden"
    );

    startCountdown();
}


/* =========================================================
   RESIZE
   ========================================================= */

window.addEventListener(
    "resize",
    ()=>{

        camera.aspect=
            window.innerWidth/
            window.innerHeight;

        camera.updateProjectionMatrix();

        renderer.setSize(
            window.innerWidth,
            window.innerHeight
        );

        renderer.setPixelRatio(
            Math.min(
                window.devicePixelRatio,
                1.5
            )
        );

        resizeMiniMap();
    }
);


/* =========================================================
   MAIN LOOP
   ========================================================= */

const clock=
    new THREE.Clock();


function animate(){

    requestAnimationFrame(
        animate
    );

    const dt=
        Math.min(
            clock.getDelta(),
            .033
        );

    updatePhysics(dt);

    updateAI(dt);

    updatePlayerAICollisions();

    updateAICollisions();

    updateLapSystem(dt);

    updateCamera(dt);

    updateHUD();

    renderer.render(
        scene,
        camera
    );
}


/* =========================================================
   START GAME
   ========================================================= */

resizeMiniMap();

restartRace();

animate();
