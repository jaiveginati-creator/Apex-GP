name: Monza tree upgrade

on:
  push:
    branches: [trees/monza-forest-upgrade]

permissions:
  contents: write

jobs:
  upgrade-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: trees/monza-forest-upgrade
          persist-credentials: true
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Apply Monza foliage upgrade
        run: node scripts/upgrade-monza-trees.mjs
      - name: Validate tree geometry and inline JavaScript
        run: node scripts/test-monza-trees.mjs
      - name: Check multiplayer client scripts
        run: node --check client/netgame.js && node --check client/multiplayer.js
      - name: Run multiplayer regression suite
        working-directory: server
        run: |
          npm ci
          npm test
      - name: Commit tested Monza upgrade
        run: |
          if git diff --quiet; then
            echo "No generated changes to commit."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add index.html
            git commit -m "Upgrade Monza tree canopy detail"
            git push origin HEAD:trees/monza-forest-upgrade
          fi
