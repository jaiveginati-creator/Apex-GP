name: Monaco circuit validation

on:
  push:
    branches: [fix/monaco-tunnel-layout]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Validate Monaco layout and tunnel geometry
        run: node scripts/test-monaco-circuit.mjs
