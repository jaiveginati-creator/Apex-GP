name: Apex GP multiplayer checks

on:
  push:
    branches: [main, multiplayer-overhaul, trees/monza-roadside-density]
  pull_request:
    branches: [main]

jobs:
  server-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: server/package-lock.json
      - name: Install server dependencies
        working-directory: server
        run: npm ci
      - name: Check browser multiplayer scripts
        run: node --check client/netgame.js && node --check client/multiplayer.js
      - name: Check Monza tree geometry and inline JavaScript
        run: node scripts/test-monza-trees.mjs
      - name: Check AI corner speed planning
        run: node scripts/test-ai-corner-planning.mjs
      - name: Run multiplayer test suite
        working-directory: server
        run: npm test
