name: Monaco guardrail regression
on:
  pull_request:
    paths:
      - "index.html"
      - "scripts/test-monaco-circuit.mjs"
      - ".github/workflows/monaco-regression.yml"
  push:
    branches: [main]
    paths:
      - "index.html"
      - "scripts/test-monaco-circuit.mjs"
      - ".github/workflows/monaco-regression.yml"
jobs:
  monaco-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate Monaco circuit and guardrail collision
        run: node scripts/test-monaco-circuit.mjs
